name: Bug report
description: Report a reproducible problem without private data.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: 'Read the troubleshooting guide first. Do not upload credentials, tickets, config dumps, private transcripts, .dev/, or raw browser reports. Use private vulnerability reporting for security issues.'
  - type: input
    id: versions
    attributes:
      label: Plugin and Hermes version/commit
      placeholder: 'Multi Chat 0.1.1; Hermes 0.22.6; commit f0d94882e89a'
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Browser, OS and HTTP/HTTPS
      placeholder: 'Chromium version; Linux server; HTTP LAN or HTTPS (no private hostname needed)'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce with disposable state
      description: 'Expected versus actual behavior; redact project paths, account status and session IDs.'
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: 'This is the default-profile Hermes Web Dashboard, not Desktop.'
          required: true
        - label: 'I removed passwords, API keys, cookies, tickets, private transcripts and private host/path details.'
          required: true

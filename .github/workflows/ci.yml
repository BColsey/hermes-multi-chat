name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build, tests, docs and package
    # Persistent self-hosted workers only execute trusted repository-owner PRs.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)
    runs-on: [self-hosted, linux, x64, r720-multi-chat]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: npm run typecheck
      - run: npm run lint
      - run: ruff format --check install.py dashboard catalog scripts tests
      - run: ruff check install.py dashboard catalog scripts tests
      - run: npm test
      - run: npm run test:python
      - run: npm run check:public
      - run: npm run package
      - run: npm run catalog:check
      - name: Check archive and installer digests
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

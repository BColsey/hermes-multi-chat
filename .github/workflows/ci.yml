name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build, tests, docs and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: npm run typecheck
      - run: npm run lint
      - run: ruff format --check install.py dashboard scripts tests
      - run: ruff check install.py dashboard scripts tests
      - run: npm test
      - run: npm run test:python
      - run: npm run check:public
      - run: npm run package
      - name: Check archive and installer digests
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

name: Release SBOM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (vMAJOR.MINOR.PATCH)'
        required: true
        default: v0.2.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-sbom-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  sbom:
    runs-on: [self-hosted, linux, x64, r720-multi-chat]
    timeout-minutes: 10
    permissions:
      contents: write # Only this release/manual job may attach release metadata.
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Validate tag before using it in a checkout or command
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the exact released source, not current dependency versions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Pin the SBOM toolchain used by the published metadata
        run: |
          npm install --global --prefix "$RUNNER_TEMP/sbom-npm" --ignore-scripts --no-audit --no-fund npm@10.9.9
          echo "$RUNNER_TEMP/sbom-npm/bin" >> "$GITHUB_PATH"
      - name: Require the tag and lockfile to describe the same release
        run: node -e 'if ("v" + require("./release-source/package.json").version !== process.env.RELEASE_TAG) process.exit(1)'
      - name: Download only public release artifacts and their receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets \
            --pattern "multi-chat-${RELEASE_TAG#v}.tar.gz" \
            --pattern "multi-chat-${RELEASE_TAG#v}.tar.gz.sha256" \
            --pattern install.py --pattern install.py.sha256
      - name: Generate a runtime-only CycloneDX SBOM bound to verified artifact hashes
        run: node scripts/sbom.mjs release-source release-assets
      - name: Install isolated schema validation tools
        run: python -m pip install --disable-pip-version-check -r requirements-security.txt
      - name: Validate the official CycloneDX 1.5 schema
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from cyclonedx.schema import SchemaVersion
          from cyclonedx.validation.json import JsonValidator
          path = Path('release-assets') / ('multi-chat-' + os.environ['RELEASE_TAG'][1:] + '.cdx.json')
          errors = list(JsonValidator(SchemaVersion.V1_5).validate_str(path.read_text(), all_errors=True) or ())
          if errors:
              raise SystemExit('\n'.join(str(error) for error in errors))
          print('CycloneDX schema passed')
          PY
      - name: Attach missing metadata, or verify identical existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p existing-sbom
          for file in "release-assets/multi-chat-${RELEASE_TAG#v}.cdx.json" "release-assets/multi-chat-${RELEASE_TAG#v}.cdx.json.sha256"; do
            name=$(basename "$file")
            if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir existing-sbom >/dev/null 2>&1; then
              cmp -- "$file" "existing-sbom/$name"
            else
              gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done
